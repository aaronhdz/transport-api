spring.application.name=transport-api

# ===============================
# DATABASE
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/transport_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ===============================
# FLYWAY
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===============================
# SERVER
# ===============================
server.port=8080

# ===============================
# JWT
# ===============================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=3600000

# ===============================
# AUTHENTICATION
# ===============================
app.security.username=${APP_USERNAME}
app.security.password-hash=${APP_PASSWORD_HASH}

app.storage.location=${STORAGE_LOCATION:storage}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
